apiVersion: apps/v1
kind: Deployment
metadata:
  name: campus-energy-monitor-system
  labels:
    app: campus-energy-monitor-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: campus-energy-monitor-system
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: campus-energy-monitor-system
    spec:
      containers:
      - name: campus-energy-monitor-system
        image: 78619/campus-energy-monitor-system:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: campus-energy-service
spec:
  type: NodePort
  selector:
    app: campus-energy-monitor-system
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
